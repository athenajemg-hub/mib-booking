<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — MIB Photoman</title>
<meta name="description" content="MIB Photoman — event photography and on-site printing. Book your event online.">
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<header id="site-header"></header>
<main>
  <div class="auth-wrap">
    <aside class="auth-side dark">
      <img src="/img/logo-white.png" alt="MIB Photoman">
      <div><h2>Every guest seen, captured, and remembered.</h2><p class="muted" style="margin-top:1rem">Event photography + On-site printing</p></div>
    </aside>
    <div class="auth-main">
      <div class="auth-box">
        <p class="eyebrow">Password</p>
        <h1>Choose a new password</h1>
        <form id="reset-form">
          <div class="field"><label for="n-pass">New password (8–16 characters)</label><input id="n-pass" type="password" minlength="8" maxlength="16" required autocomplete="new-password"></div>
          <div class="field"><label for="n-pass2">Confirm new password</label><input id="n-pass2" type="password" minlength="8" maxlength="16" required autocomplete="new-password"></div>
          <button class="btn btn-block" type="submit">Save new password</button>
          <p class="small" style="margin-top:1.1rem"><a href="/login.html">← Back to login</a></p>
        </form>
      </div>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<div id="toast" aria-live="polite"></div>
<script src="/js/app.js"></script>
<script src="/js/reset.js"></script>
</body>
</html>
